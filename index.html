<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#803d4b"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="style.css"><title>神村商店｜仕入れ・在庫管理</title></head><body><div id="toast" role="status"></div><main id="app"><section id="login" class="auth"><h1>神村商店</h1><p>仕入れ・在庫・仕込み管理</p><form id="loginForm"><input id="email" type="email" placeholder="メールアドレス" required><input id="password" type="password" placeholder="パスワード（6文字以上）" minlength="6" required><button type="submit">ログイン</button></form><button id="signup" class="secondary">新規登録</button><p class="hint">新規登録後は管理者の承認が必要です。</p></section><section id="shell" hidden><header><div><small>KAMIMURA SHOTEN</small><h1>神村商店</h1></div><div><span id="who"></span><button id="logout" class="secondary">ログアウト</button></div></header><div id="pending" hidden class="panel"><h2>承認待ち</h2><p>管理者がアカウントを承認するまで店舗データは表示されません。</p></div><div id="workspace" hidden><div id="content"></div><nav id="tabs"><button data-tab="home">⌂<small>ホーム</small></button><button data-tab="inventory">▤<small>在庫</small></button><button data-tab="orders">🛒<small>発注</small></button><button data-tab="prep">☑<small>仕込み</small></button><button data-tab="more">☰<small>その他</small></button></nav></div></section></main><script type="module" src="script.js"></script></body></html>
